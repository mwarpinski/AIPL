# The parser, checker, resolver, and wasm compiler recurse once per nesting
# level of the program, and the toolchain's own sources are deep. The CLI runs
# its work on a 1 GiB-stack thread (referee/src/main.rs); test threads get the same
# headroom here instead of the 2 MiB default.
[env]
RUST_MIN_STACK = "268435456"

# Windows: link the C runtime into the programs, so they run on a machine that
# has no Visual C++ Redistributable (a fresh Windows has no vcruntime140.dll).
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
