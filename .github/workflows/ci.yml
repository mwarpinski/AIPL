# Builds AIPL and runs every test on Linux x86-64 (the native backend's
# platform): clippy with warnings as errors, the Rust test suite, and the
# AIPL-native suite. See DEVELOPING.md, "How to verify everything".
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --release --no-fail-fast
      - name: AIPL test suite
        run: ./target/release/aipl test aipl_src/test_suite.aipl
