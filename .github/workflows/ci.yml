# Two jobs on Linux x86-64. `selfhosted` is what ships: the compiler built from the checked-in seed with no Rust, and
# on it the AIPL suite, the conformance suite, lint, fmt, and the documentation checks. `referee` is the Rust crate
# in referee/, development only: clippy with warnings as errors, the Rust test suite, 3,000 mutated programs through
# both toolchains (tools/fuzz.py), 500 generated programs run in the VM, as wasm, and natively (tools/run_fuzz.py),
# the optimizer against itself (tools/opt_diff.py), the fuzzers with fixed seeds. See DEVELOPING.md, "How to verify
# everything". The arm64 job builds and tests on Linux AArch64 (GitHub's ubuntu-24.04-arm runner), where the AArch64
# backend's executables run as they are, and has the compiler built for AArch64 compile itself there.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  # What ships: the self-hosted toolchain, built from the checked-in seed with no Rust. Every check here runs on it
  # (docs/RELEASING.md; Rust is the referee, below, and development-only).
  selfhosted:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIPL: ${{ github.workspace }}/target/bootstrap/aipl
      AIPL_STD: ${{ github.workspace }}/aipl_src/std/
    steps:
      - uses: actions/checkout@v4
      - name: The seed builds the compiler, and it rebuilds itself unchanged
        run: sh bootstrap/build.sh
      - name: AIPL test suite
        run: $AIPL run aipl_src/test_suite.aipl
      - name: The conformance suite
        run: python3 tools/conformance.py --aipl $AIPL --backend run --backend wasm --backend native
      - name: aipl lint, clean on the standard library and on aipl_src
        run: $AIPL lint aipl_src/std/*.aipl aipl_src/*.aipl aipl_src/native/*.aipl
      - name: aipl fmt --check, the repository's programs are formatted
        run: $AIPL fmt --check $(find . -name '*.aipl' -not -path './target/*' -not -path './.git/*' | xargs grep -L -e @reject -e @syntax)
      - name: The documentation, against the repository
        run: python3 tools/docs_check.py
      - name: The grammar in the specification, against every program in the repository
        run: python3 tools/grammar_check.py
      - name: The standard library reference, against aipl doc
        run: python3 tools/std_reference.py --check
      - name: Release facts, the version is one number and each seed's hash is the recorded one
        run: |
          python3 tools/release_check.py version
          python3 tools/release_check.py seeds

  # The Rust referee, in development only: does the self-hosted toolchain do what the Rust one does and the
  # specification says (the same programs accepted and refused, the same diagnostics, the same behaviour)?
  referee:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --release --no-fail-fast
      - name: Native executables on a system without openat2
        run: python3 tools/without_openat2.py cargo test --release --test test_native
      - name: AIPL test suite, in the Rust VM
        run: ./target/release/aipl test aipl_src/test_suite.aipl
      - name: Mutated programs, Rust toolchain against the self-hosted one
        run: python3 tools/fuzz.py --cases 3000 --seed 1
      - name: Generated programs, VM against compiled code
        run: python3 tools/run_fuzz.py --cases 500 --seed 1
      - name: The optimizer, optimized programs against unoptimized ones
        run: |
          python3 tools/opt_diff.py
          python3 tools/opt_diff.py --fuzz 500 --seed 1
      - name: The A/B harness, its references and toolchain paths
        run: python3 tools/harness/harness.py selftest
      - name: The conformance suite, on the Rust aipl
        run: python3 tools/conformance.py --aipl target/release/aipl --backend run --backend wasm --backend native
      - name: The tests left nothing behind in the repository
        run: python3 tools/tree_check.py

  arm64:
    # AArch64 Linux: the Rust test suite (the AArch64 backend's executables run on this
    # machine, tests/arm64), the AIPL suite, and the compiler built for AArch64
    # compiling itself to the same bytes (docs/design/ARM64_PLAN.md).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --release --no-fail-fast
      - name: AIPL test suite
        run: ./target/release/aipl test aipl_src/test_suite.aipl
      - name: The conformance suite (the native executables are AArch64 ones)
        run: python3 tools/conformance.py --aipl target/release/aipl --backend run --backend wasm --backend native
      - name: The AArch64 seed builds the compiler, and rebuilds it unchanged
        run: sh bootstrap/build.sh
      - name: The compiler for AArch64 compiles itself
        run: |
          ./target/release/aipl compile --exe --target arm64 --allow-run '*' aipl_src/aipl.aipl -o target/stage1
          ./target/stage1 compile --exe --target arm64 --allow-run '*' aipl_src/aipl.aipl -o target/stage2
          cmp target/stage1 target/stage2

  install:
    # install.sh, as a user runs it: shellcheck, then a full source install of
    # this commit into an empty home, a second run (an update), and
    # --uninstall; then the same for a release tarball built from this commit.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Install, update, uninstall
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" AIPL_REPO="file://$GITHUB_WORKSPACE" AIPL_REF="$GITHUB_SHA"
          touch "$HOME/.bashrc"
          sh install.sh
          sh install.sh
          [ "$(grep -c aipl "$HOME/.profile")" = 1 ] && [ "$(grep -c aipl "$HOME/.bashrc")" = 1 ]
          sh -c '. "$HOME/.aipl/env" && aipl --version'
          sh install.sh --uninstall
          [ ! -e "$HOME/.aipl" ] && ! grep -q aipl "$HOME/.profile" "$HOME/.bashrc"
      - name: Install a release tarball (the default install), as install.sh does with a downloaded one
        run: |
          cargo build --release --locked
          sh bootstrap/build.sh
          sh tools/package_release.sh dist
          mkdir -p dist-site/latest/download
          cp dist/* dist-site/latest/download/
          export HOME="$(mktemp -d)" AIPL_RELEASES="file://$PWD/dist-site"
          touch "$HOME/.bashrc"
          sh install.sh
          sh install.sh
          [ "$(grep -c aipl "$HOME/.profile")" = 1 ]
          # started by name, from outside any checkout: the installed library is found beside bin/
          sh -c '. "$HOME/.aipl/env" && cd "$HOME" && aipl --version && aipl doc str | head -1'
          sh install.sh --uninstall
          [ ! -e "$HOME/.aipl" ]

  windows:
    # Windows x86-64 (windows-latest): the toolchain builds and runs what goes through WebAssembly (most Rust
    # tests assume Linux and are not run here; test_windows and test_net are), then the release zip is packed and installed by install.ps1
    # from this commit, as a user's machine would take it.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
      - name: AIPL test suite
        run: ./target/release/aipl.exe test aipl_src/test_suite.aipl
      - name: Windows tests (processes, exec, absolute paths) and the socket tests
        run: cargo test --release --locked --test test_windows --test test_net
      - name: A program compiles and runs, as WebAssembly and as an executable
        shell: pwsh
        run: |
          $d = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'prog')
          Set-Location $d
          @'
          (module hello
            (import io)
            (fn main [] -> i32
              (call io.println "hello from windows")
              0))
          '@ | Set-Content -Encoding ascii hello.aipl
          $bin = Join-Path $env:GITHUB_WORKSPACE 'target\release'
          & "$bin\aipl.exe" compile hello.aipl -o hello.wasm; if ($LASTEXITCODE) { exit 1 }
          & "$bin\aipl-run.exe" hello.wasm; if ($LASTEXITCODE) { exit 1 }
          & "$bin\aipl.exe" compile --exe hello.aipl -o hello.exe; if ($LASTEXITCODE) { exit 1 }
          & .\hello.exe; if ($LASTEXITCODE) { exit 1 }
      - name: Pack the release zip and install it (install, update, uninstall)
        shell: pwsh
        run: |
          pwsh tools/package_release.ps1 dist
          # the checksum file is one line ending in LF: sha256sum -c, and the release workflow's comparison, take it exactly
          $sum = Get-Content -Raw (Get-ChildItem dist/*.sha256).FullName
          if ($sum -match "`r" -or $sum -notmatch "`n$") { Write-Error 'the .sha256 file is not one LF-ended line'; exit 1 }
          New-Item -ItemType Directory -Force dist-site/latest/download | Out-Null
          Copy-Item dist/* dist-site/latest/download/
          $env:AIPL_RELEASES = "file:///$((Resolve-Path dist-site).Path -replace '\\','/')"
          $env:AIPL_HOME = Join-Path $env:RUNNER_TEMP 'aipl-home'
          $env:AIPL_NO_PATH = '1'
          pwsh install.ps1
          pwsh install.ps1
          if (-not (Test-Path "$env:AIPL_HOME/bin/aipl.exe")) { exit 1 }
          $env:AIPL_UNINSTALL = '1'
          pwsh install.ps1
          if (Test-Path $env:AIPL_HOME) { exit 1 }
