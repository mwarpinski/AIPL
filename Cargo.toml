[package]
name = "aipl"
version = "0.1.0"
edition = "2021"
authors = ["Matt Warpinski"]
description = "AIPL: a statically typed S-expression language for AI agents, compiled to WebAssembly and to native Linux x86-64 executables, with a self-hosted compiler written in AIPL."

[dependencies]
wasm-encoder = "0.224.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
# wasmtime runs compiled modules (the aipl-run launcher, the tests) and, inside
# the aipl CLI, the native backend, which is AIPL compiled to wasm.
wasmtime = "48.0.2"
wasmtime-wasi = "48"

[[bin]]
name = "aipl"
path = "src/main.rs"

[[bin]]
name = "aipl-run"
path = "src/bin/aipl_run.rs"

[lib]
name = "aipl_core"
path = "src/lib.rs"

[dev-dependencies]
wasmparser = "0.224.0"


# Standalone executables embed the aipl-run launcher; stripped, it is about 18 MB.
[profile.release]
strip = true
