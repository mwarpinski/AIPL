[package]
name = "aipl"
version = "0.1.0"
edition = "2021"
authors = ["AI Swarm Team <ai@antigravity.internal>"]
description = "AI Programming Language (AIPL) - Machine-native, token-efficient, formally verifiable programming language and self-hosting Wasm compiler."

[dependencies]
wasm-encoder = "0.224.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"

[[bin]]
name = "aipl"
path = "src/main.rs"

[[bin]]
name = "execution_bench"
path = "benches/execution_bench.rs"

[lib]
name = "aipl_core"
path = "src/lib.rs"

[dev-dependencies]
wasmparser = "0.224.0"

