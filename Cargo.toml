# The Rust crate in referee/ is the reference toolchain: it judges, in development CI, whether the self-hosted
# toolchain (aipl_src/) does what the specification says. Users never build it and the release never runs it
# (docs/RELEASING.md). This manifest only names it, so `cargo build --release` here still builds it, into target/.
[workspace]
members = ["referee"]
resolver = "2"

# Standalone executables embed the aipl-run launcher; stripped, it is about 18 MB.
[profile.release]
strip = true
