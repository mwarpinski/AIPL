[package]
name = "aipl"
version = "0.1.0"
edition = "2021"
authors = ["AI Swarm Team <ai@antigravity.internal>"]
description = "AIPL: a statically typed S-expression language for AI agents, compiled to WebAssembly by a toolchain written in AIPL itself."

[dependencies]
wasm-encoder = "0.224.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"
# Only the aipl-run launcher uses wasmtime; the compiler does not.
wasmtime = "48.0.2"
wasmtime-wasi = "48"

[[bin]]
name = "aipl"
path = "src/main.rs"

[[bin]]
name = "aipl-run"
path = "src/bin/aipl_run.rs"

[[bin]]
name = "execution_bench"
path = "benches/execution_bench.rs"

[lib]
name = "aipl_core"
path = "src/lib.rs"

[dev-dependencies]
wasmparser = "0.224.0"


# Standalone executables embed the aipl-run launcher; stripped, it is about 18 MB.
[profile.release]
strip = true
