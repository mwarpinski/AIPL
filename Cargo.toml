[package]
name = "aipl"
version = "0.1.0"
edition = "2021"
authors = ["Matt Warpinski"]
description = "AIPL: a statically typed S-expression language for AI agents, compiled to WebAssembly and to native Linux x86-64 executables, with a self-hosted compiler written in AIPL (on Linux x86-64 it builds from a checked-in seed with no Rust; this crate is the reference toolchain, the interpreter, and the WebAssembly launcher)."

[dependencies]
wasm-encoder = "0.224.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
# wasmtime runs compiled modules (the aipl-run launcher, the tests) and, inside
# the aipl CLI, the native backend, which is AIPL compiled to wasm.
wasmtime = "48.0.2"
wasmtime-wasi = "48"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"

# the Windows host's calls that std does not make: WSAPoll for a socket's readiness, PeekNamedPipe for a
# pipe's, TerminateProcess for a signal
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[[bin]]
name = "aipl"
path = "src/main.rs"

[[bin]]
name = "aipl-run"
path = "src/bin/aipl_run.rs"

[lib]
name = "aipl_core"
path = "src/lib.rs"

[dev-dependencies]
libm = "0.2"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
wasmparser = "0.224.0"


# Standalone executables embed the aipl-run launcher; stripped, it is about 18 MB.
[profile.release]
strip = true
